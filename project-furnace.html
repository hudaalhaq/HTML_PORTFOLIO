<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automatic Hi-Pot Testing Machine — PLC Control System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0e1a;
    --bg-soft: #0d1220;
    --surface: #121a2c;
    --surface-2: #161f38;
    --border: #232f4a;
    --border-soft: #1a2338;
    --text: #e8edf7;
    --text-dim: #97a3bd;
    --text-faint: #5f6b87;
    --accent: #4d9fff;
    --accent-bright: #7cbaff;
    --accent-dim: rgba(77,159,255,0.12);
    --accent-line: rgba(77,159,255,0.28);
    --good: #34d399;
    --warn: #f5a55a;
    --bad: #f2617a;
    --radius: 14px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:
      radial-gradient(1100px 600px at 15% -10%, rgba(77,159,255,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 10%, rgba(77,159,255,0.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', -apple-system, sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Space Grotesk', 'Inter', sans-serif; 
    letter-spacing:-0.01em; 
    color:#fff;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  a{color:var(--accent-bright);}
  img{max-width:100%; display:block;}
  .wrap{
    max-width:1150px; 
    margin:0 auto; 
    padding:0 20px;
  }

  /* ---------- NAV ---------- */
  header.site-nav{
    position:sticky; top:0; z-index:50;
    background:rgba(10,14,26,0.82);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border-soft);
  }
  .nav-inner{
    max-width:1280px; margin:0 auto; padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .logo{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:1.05rem;
    color:#fff; letter-spacing:0.02em;
  }
  .logo span{color:var(--accent);}
  nav.links{display:flex; gap:28px;}
  nav.links a{
    color:var(--text-dim); text-decoration:none; font-size:0.88rem; font-weight:500;
    transition:color .15s;
  }
  nav.links a:hover{
    color:var(--text);
  }

  /* ---------- HERO ---------- */
  .hero{
    padding:10px 0 56px;
  }
  .eyebrow{
    display:inline-flex; 
    align-items:center; 
    gap:8px;
    font-family:'JetBrains Mono', monospace; 
    font-size:0.74rem; 
    letter-spacing:0.08em;
    text-transform:uppercase; 
    color:var(--accent-bright);
    background:var(--accent-dim); 
    border:1px solid var(--accent-line);
    padding:6px 12px; 
    border-radius:100px; 
    margin-bottom:22px;
  }
  .eyebrow::before{
    content:"●"; 
    font-size:0.55rem; 
    color:var(--good);
  }
  .hero-flex{
    margin-top:10px; 
    display:flex; 
    align-items:stretch; 
    gap:4px; 
  }
  .hero-left{
    flex:1;
    min-width:0;
    display:flex; 
    flex-direction:column;
    justify-content:flex-start;
  }
  .hero-right{
    flex:0 0 330px;
    width:460px;
    position:relative;
    min-height:280px;
  }
  .hero-right .poster-frame{
    position:absolute;
    inset:0;
    margin-top:0;
    display:flex;
  }
  .hero h1{
    font-size:clamp(1.9rem, 4.2vw, 3.05rem);
    font-weight:700; 
    line-height:1.12; 
    max-width:max-content;
    text-align:justify;
  }
  .hero h1 em{
    font-style:normal; 
    color:var(--accent-bright);
  }
  .hero p.lede{
    margin-top:20px;
    color:var(--text-dim); 
    font-size:1.06rem; 
    max-width:max-content;
    text-align: justify;
  }
  .author-row{
    margin-top:28px; 
    display:flex; 
    flex-wrap:wrap; 
    gap:10px;
  }
  .pill{
    font-size:0.82rem; color:var(--text-dim); background:var(--surface);
    border:1px solid var(--border); padding:7px 14px; border-radius:100px;
  }
  .pill b{
    color:var(--text); 
    font-weight:600;
  }

  /* ---------- STAT STRIP ---------- */
  .stat-strip{
    margin-top:46px; 
    display:grid; 
    grid-template-columns:repeat(4,1fr); 
    gap:1px;
    background:var(--border); 
    border:1px solid var(--border); 
    border-radius:var(--radius);
    overflow:hidden;
  }
  .stat{
    background:var(--surface); 
    padding:22px 20px;
  }
  .stat .num{
    font-family:'Space Grotesk', sans-serif; 
    font-size:1.7rem; font-weight:700; 
    color:var(--accent-bright);
    line-height:1.1;
  }
  .stat .label{
    font-size:0.8rem; 
    color:var(--text-dim); 
    margin-top:6px;
  }

  /* ---------- POSTER ---------- */
  .poster-frame{
    border:1px solid var(--border); 
    border-radius:var(--radius);
    overflow:hidden; 
    background:var(--surface);
    width:100%;
  }
  .poster-frame img{
    width:100%; 
    height:100%; 
    object-fit:contain;
    display:block;
  }
  .poster-cap{
    padding:12px 20px; 
    font-size:0.8rem; 
    color:var(--text-faint); 
    border-top:1px solid var(--border-soft);
  }

  /* ---------- SECTION SCAFFOLD ---------- */
  section{
    padding:70px 0;
  }
  section + section{
    border-top:1px solid var(--border-soft);
  }
  .sec-head{
    display:flex; 
    align-items:baseline; 
    gap:16px; margin-bottom:36px;
  }
  .sec-num{
    font-family:'JetBrains Mono', monospace; 
    color:var(--text-faint); 
    font-size:0.9rem;
  }
  .sec-head h2{
    font-size:1.7rem;
  }
  .sec-lede{
    color:var(--text-dim); 
    max-width:fit-content; 
    margin-bottom:36px; 
    font-size:1rem;
    text-align: justify;
  }

  /* ---------- INTRO / TWO COL ---------- */
  .two-col{
    display:grid; 
    grid-template-columns:1.1fr 0.9fr; 
    gap:44px;
  }
  .prose p{
    color:var(--text-dim); 
    margin-bottom:16px;
    text-align:justify;
  }
  .prose strong{
    color:var(--text); 
    font-weight:600;
  }
  .callout{
    background:var(--surface); 
    border:1px solid var(--border); 
    border-radius:var(--radius);
    padding:22px 24px;
  }
  .callout h4{
    font-size:0.92rem; 
    color:var(--accent-bright); 
    margin-bottom:12px; 
    font-family:'JetBrains Mono', monospace; 
    text-transform:uppercase; 
    letter-spacing:0.05em; 
    font-weight:500;
  }
  .callout ul{
    padding-left:18px; 
    color:var(--text-dim); 
    font-size:0.93rem;
    text-align:justify;
  }
  .callout li{
    margin-bottom:8px;
  }
  .callout li::marker{
    color:var(--accent);
  }

  /* ---------- METHOD FLOW ---------- */
  .flow{
    display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:40px;
  }
  .flow-step{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px 18px;
    position:relative;
  }
  
  .flow-step .idx{
    font-family:'JetBrains Mono', monospace;
    color:var(--accent); font-size:0.78rem;
    margin-bottom:10px; display:block;
  }

  .flow-step h4{
    font-size:0.91rem;
    margin-bottom:6px;
    color:#fff;
  }

  .flow-step p{
    font-size:0.68rem;
    color:var(--text-dim);
    text-align:justify;
  }

  .flow-arrow{
    display:none;
  }

  .method-grid{
    display:grid; 
    grid-template-columns:1fr 1fr; 
    gap:24px; 
    margin-top:8px;
  }

  .stack{
    display:flex; 
    flex-direction:column; 
    gap:24px;
  }
  
  .img-card{
    background:var(--surface); 
    border:1px solid var(--border); 
    border-radius:var(--radius); 
    overflow:hidden;
  }

  .img-card img{width:100%; background:#fff;}
  .img-card .cap{padding:14px 18px; font-size:0.85rem; color:var(--text-dim); border-top:1px solid var(--border-soft);}
  .img-card .cap b{color:var(--text);}

  table.spec{
    width:100%; border-collapse:collapse; font-size:0.87rem; margin-top:6px;
  }
  table.spec th, table.spec td{
    text-align:left; padding:10px 14px; border-bottom:1px solid var(--border-soft);
  }
  table.spec th{color:var(--text-faint); font-weight:500; font-family:'JetBrains Mono', monospace; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em;}
  table.spec td{color:var(--text-dim);}
  table.spec td.k{color:var(--text); font-weight:500;}
  table.spec tr:last-child td{border-bottom:none;}

  .rule-badges{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px; 
    margin-top:14px;
    margin-bottom:14px;
  }
  
  .rule-badge{
    font-family:'JetBrains Mono', monospace; 
    font-size:0.75rem; 
    padding:6px 11px; 
    border-radius:8px;
    background:var(--bg-soft); 
    border:1px solid var(--border); 
    color:var(--text-dim);
  }
  
  .rule-badge b{
    color:var(--accent-bright);
  }

  /* ---------- RESULTS ---------- */
  .result-block{
    margin-bottom:52px;
  }
  .result-block:last-child{
    margin-bottom:0;
  }
  .result-block h3{
    font-size:1.15rem; 
    margin-bottom:6px;
  }
  .result-block .sub{
    color:var(--text-dim);
    font-size:0.92rem; 
    margin-bottom:22px; 
    max-width:max-content;
    text-align:justify;
  }
  .compare-grid{
    display:grid; 
    grid-template-columns:1fr 1fr 1fr; 
    gap:24px;
  }
  .compare-grid .img-card .cap{
    display:flex; 
    justify-content:space-between; 
    align-items:center;
  }
  .tag{
    font-size:0.7rem; 
    padding:3px 9px; 
    border-radius:100px; 
    font-family:'JetBrains Mono', monospace;
  }
  .tag.normal{
    background:rgba(97, 165, 242, 0.14); 
    color:#2f8fe6;
  }
  .tag.on{
    background:rgba(242,97,122,0.14); 
    color:var(--bad);
  }
  .tag.fz{
    background:rgba(52,211,153,0.14); 
    color:var(--good);
  }

  /* OCPI bar chart (signature element) */
  .ocpi-panel{
    background:var(--surface); 
    border:1px solid var(--border); 
    border-radius:var(--radius);
    padding:28px 30px;
  }
  .ocpi-row{display:flex; align-items:center; gap:18px; margin-bottom:20px;}
  .ocpi-row:last-child{margin-bottom:0;}
  .ocpi-name{width:170px; font-size:0.88rem; color:var(--text-dim); flex-shrink:0;}
  .ocpi-name b{color:var(--text); display:block; font-size:0.92rem;}
  .ocpi-track{flex:1; background:var(--bg-soft); border-radius:8px; height:26px; position:relative; overflow:hidden; border:1px solid var(--border-soft);}
  .ocpi-fill{height:100%; border-radius:8px; display:flex; align-items:center; justify-content:flex-end; padding-right:10px;}
  .ocpi-fill span{font-family:'JetBrains Mono', monospace; font-size:0.78rem; color:#0a0e1a; font-weight:600;}
  .ocpi-fill.best{background:linear-gradient(90deg, #2f8fe6, #7cbaff);}
  .ocpi-fill.mid{background:#4a5a7a;}
  .ocpi-fill.low{background:#37425e;}
  .ocpi-panel .foot-note{margin-top:20px; font-size:0.8rem; color:var(--text-faint); border-top:1px solid var(--border-soft); padding-top:16px;}

  .data-table-wrap{
    background:var(--surface); 
    border:1px solid var(--border); 
    border-radius:var(--radius);
    padding:6px 24px; 
    margin-top:28px; 
    overflow-x:auto;
  }

  /* ---------- Gallery ---------- */
  .gallery{display:grid; grid-template-columns:1fr 1.4fr; gap:24px;}
  .gallery .img-card:first-child{grid-row:span 1;}

  /* ---------- Conclusion ---------- */
  .conclusion-card{
    background:linear-gradient(160deg, rgba(77,159,255,0.09), rgba(77,159,255,0.02));
    border:1px solid var(--accent-line); 
    border-radius:var(--radius); 
    padding:36px;
  }
  .conclusion-card p{
    color:var(--text-dim); 
    margin-bottom:14px; 
    max-width:fit-content;
    text-align:justify;
  }
  .conclusion-card p:last-child{
    margin-bottom:0;
  }
  .conclusion-card strong{
    color:var(--text);
  }

  footer{
    padding:40px 0 60px; 
    border-top:1px solid var(--border-soft);
    justify-content:space-between; 
    flex-wrap:wrap;
    gap:12px;
    color:var(--text-faint); 
    font-size:0.82rem;
    text-align:right;
  }
  footer a{
    color:var(--text-dim); 
    text-decoration:none;
  }

  @media (max-width:820px){
    .two-col, .method-grid, .compare-grid, .gallery{grid-template-columns:1fr;}
    .hero-flex{flex-direction:column;}
    .hero-right{width:100%; max-width:320px; min-height:0; margin-top:8px; position:static;}
    .hero-right .poster-frame{position:static; height:auto;}
    .poster-frame img{height:auto; object-fit:contain;}
    .flow{grid-template-columns:1fr 1fr;}
    .stat-strip{grid-template-columns:1fr 1fr;}
    .ocpi-name{width:120px; font-size:0.8rem;}
  }
  @media (max-width:520px){
    .flow{grid-template-columns:1fr;}
    .stat-strip{grid-template-columns:1fr;}
  }

  ::selection{background:var(--accent-dim); color:#fff;}
</style>
</head>
